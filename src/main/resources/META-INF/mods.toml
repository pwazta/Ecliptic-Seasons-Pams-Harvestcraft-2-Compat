modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"
issueTrackerURL="https://github.com/pwazta/Ecliptic-Seasons-Pams-Harvestcraft-2-Compat/issues"

[[mixins]]
config="eclipticseasonspamhc2compat.mixins.json"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''Pam's Harvestcraft 2 crops, saplings, and fruit blocks respect Ecliptic Seasons.'''

[[dependencies.${mod_id}]]
    modId="forge"
    mandatory=true
    versionRange="${forge_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    mandatory=true
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="eclipticseasons"
    mandatory=true
    versionRange="[0.13.0-rc-1,)"
    ordering="AFTER"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="pamhc2crops"
    mandatory=false
    versionRange="[1.0.3,)"
    ordering="AFTER"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="pamhc2trees"
    mandatory=false
    versionRange="[1.0.2,)"
    ordering="AFTER"
    side="BOTH"
